server {
    server_name www.theme.com;
    listen 80;
    root /Users/joe/Documents/github/theme-v2;
    index index.html;

    # Only theme-v2 is served; old workspace URLs are retired.
    location = /v2 { return 404; }
    location ^~ /v2/ { return 404; }
    location = /section { return 302 /; }
    location = /section/ { return 302 /; }
    location = /section/index.html { return 302 /; }

    location ~ ^/(preview|api|assets)(/|$) {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:9025;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Fixtures use this directory; never fall back to the old workspace.
    location /preview-assets/ { try_files $uri =404; }
    location /css/ { try_files $uri @remote_css; }
    location @remote_css {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:9025;
        proxy_set_header Host $host;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
