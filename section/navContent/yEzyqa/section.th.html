<section th:class="|section${section.settings.marginTop ? ' section-margin-top': ''}${section.settings.marginBottom ? ' section-margin-bottom': ''}${section.settings.paddingTop ? ' section-padding-top': ''}${section.settings.paddingBottom ? ' section-padding-bottom': ''} ${ section.templateId } section-${ section.id }|" th:data-section="${section.templateId}">
    <div class="yEzyqa-label" th:if="${ not #lists.isEmpty(section.settings.itemList) }">
        <div th:class="|container${section.settings.wideScreen ? '-fluid' : ''}|">
            <a th:href="|#nav-${stat.index}|" th:each="o,stat:${section.settings.itemList}">[[${o.nav}]]</a>
        </div>
    </div>
    <div th:class="|container${section.settings.wideScreen ? '-fluid' : ''} yEzyqa-panel|" th:if="${ not #lists.isEmpty(section.settings.itemList) }">
        <div class="yEzyqa-item" th:id="|nav-${stat.index}|" th:each="o,stat:${section.settings.itemList}">
          <h3 class="text-content-heading" th:if="${not #strings.isEmpty(o.title)}">[[${o.title}]]</h3>
          <div class="section-rich-text text-rich"  th:if="${not #strings.isEmpty(o.text)}" th:utext="${o.text}"></div>
        </div>
    </div>

    
    <style th:if="${params.designMode && not #strings.isEmpty(variableCSS)}" th:inline="text" th:utext="${variableCSS}"></style>
</section>
