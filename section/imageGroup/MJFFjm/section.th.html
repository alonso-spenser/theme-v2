<section th:class="|section${section.settings.marginTop ? ' section-margin-top': ''}${section.settings.marginBottom ? ' section-margin-bottom': ''}${section.settings.paddingTop ? ' section-padding-top': ''}${section.settings.paddingBottom ? ' section-padding-bottom': ''} ${ section.templateId } section-${ section.id }|" th:data-section="${section.templateId}">
    <div th:class="|container${section.settings.wideScreen ? '-fluid no-gutters' : ''} ${ section.templateId }-item ${ section.templateId }-item-${salt.index} section-neighbor|" th:each="o,salt:${section.settings.imageList}">
        <div class="section-title">
            <h3 class="text-heading" th:if="${ not #strings.isEmpty(o.heading) }">
                [[${ o.heading }]]
            </h3>

            <th:block th:if="${not #strings.isEmpty(o.content)}" th:with="textLines = ${#strings.listSplit(o.content,'\n')}">
                <th:block th:each="textLine,saltLine:${textLines}">
                    <p class="text-body" th:if="${not #strings.isEmpty(textLine)}" th:utext="${textLine}"></p>
                </th:block>
            </th:block>
            <p class="text-btn" th:if="${ o.buttonStyle != 'invisible' && not #strings.isEmpty(o.buttonLink) && not #strings.isEmpty(o.buttonLabel) }">
                <a th:class="|btn ${ o.buttonStyle }|" th:href="${ o.buttonLink }">
                    [[${ o.buttonLabel }]]
                </a>
            </p>
        </div>
        <div th:class="|embed-responsive embed-responsive-${o.imageScale}|" th:if="${#strings.isEmpty(o.buttonLink) && not #strings.isEmpty(o.image)}">
            <img class="embed-responsive-item lazy" th:src="|${ o.image}!1|" th:data-original="${ o.image }|" th:alt="${ not #strings.isEmpty(o.alt) ? o.alt : o.heading}">
        </div>
        <a th:href="${ o.buttonLink }" th:class="|embed-responsive embed-responsive-${o.imageScale}|" th:if="${not #strings.isEmpty(o.buttonLink) && not #strings.isEmpty(o.image)}">
            <img class="embed-responsive-item lazy" th:src="|${ o.image}!1|" th:data-original="${ o.image }|" th:alt="${ not #strings.isEmpty(o.alt) ? o.alt : o.heading}">
        </a>
    </div>

    
    <style th:if="${params.designMode && not #strings.isEmpty(variableCSS)}" th:inline="text" th:utext="${variableCSS}"></style>
</section>
