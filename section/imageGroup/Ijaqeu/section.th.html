<section th:class="|section${section.settings.marginTop ? ' section-margin-top': ''}${section.settings.marginBottom ? ' section-margin-bottom': ''}${section.settings.paddingTop ? ' section-padding-top': ''}${section.settings.paddingBottom ? ' section-padding-bottom': ''} ${ section.templateId } section-${ section.id }|" th:data-section="${section.templateId}">
    <div th:class="|container${section.settings.wideScreen ? '-fluid' : ''}|">
        <div class="row" th:with="colSize = ${#lists.size(section.settings.columnList)}">
	        <div th:class="|col-md-${ col.contentWidth } col-12|" th:each="col, colSalt:${ section.settings.columnList }">
		        <th:block th:each="o, salt:${ section.settings.imageList }">
		            <th:block th:if="${salt.index % colSize == colSalt.index}">
		                <img th:class="|lazy animated ${ section.templateId }-item|" data-animate="slideInUp" th:src="${imageUrls.thumbnail(o.image)}" th:alt="${o.alt}" th:data-original="${imageUrls.original(o.image)}" th:if="${ not #strings.isEmpty(o.image) }">
                        <div th:class="|card ${ section.templateId }-item section-card related-card animated|" data-animate="slideInUp"
                                th:if="${ #strings.isEmpty(o.image) && (
                                not #strings.isEmpty(o.heading) ||
                                not #strings.isEmpty(o.content) ||
                                (not #strings.isEmpty(o.buttonLink) && not #strings.isEmpty(o.buttonLabel))
                                )}"
                            >
                            <div class="card-body">
                                <h3 class="text-heading" th:if="${not #strings.isEmpty(o.heading)}">
                                    [[${ o.heading }]]
                                </h3>
                                <p class="text-body" th:if="${not #strings.isEmpty(o.content)}" th:utext="${#strings.replace(o.content,'\n','<br>')}">
                                    [[${ o.content }]]
                                </p>
                                <p class="text-neighbor" th:if="${not #strings.isEmpty(o.buttonLink) && not #strings.isEmpty(o.buttonLabel)}">
                                    <a th:href="${ o.buttonLink}">
                                        [[${ o.buttonLabel }]]
                                    </a>
                                </p>
                            </div>
                        </div>
		            </th:block>
		        </th:block>
	        </div>
        </div>
    </div>

    
    <style th:if="${params.designMode && not #strings.isEmpty(variableCSS)}" th:inline="text" th:utext="${variableCSS}"></style>
</section>
