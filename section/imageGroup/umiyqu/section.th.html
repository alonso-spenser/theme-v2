<section th:class="|section${section.settings.marginTop ? ' section-margin-top': ''}${section.settings.marginBottom ? ' section-margin-bottom': ''}${section.settings.paddingTop ? ' section-padding-top': ''}${section.settings.paddingBottom ? ' section-padding-bottom': ''} ${ section.templateId } section-${ section.id }|" th:data-section="${section.templateId}">
    <div th:class="|container${section.settings.wideScreen ? '-fluid' : ''}|">
 	    <div class="row">
 		    <div th:class="|col-md-6 position-relative ${ section.settings.cardAlign == 'right' ? 'order-2' : '' }|">
                <img class="lazy animated" data-animate="slideInUp" th:src="${imageUrls.thumbnail(section.settings.image)}" th:alt="${section.settings.alt}" th:data-original="${imageUrls.original(section.settings.image)}" th:if="${not #strings.isEmpty(section.settings.image)}">
 			    <div class="card section-card related-card animated" data-animate="slideInUp">
 				    <div class="card-body">
                        <h3 class="text-heading" th:if="${ not #strings.isEmpty(section.settings.heading) }">
                            [[${ section.settings.heading }]]
                        </h3>
                        <th:block th:if="${not #strings.isEmpty(section.settings.content)}" th:with="textLines = ${#strings.listSplit(section.settings.content,'\n')}">
                            <th:block th:each="textLine,saltLine:${textLines}">
                                <p class="text-body" th:if="${not #strings.isEmpty(textLine)}" th:utext="${textLine}"></p>
                            </th:block>
                        </th:block>
 					    <p class="text-neighbor" th:if="${ not #strings.isEmpty(section.settings.buttonLink) && not #strings.isEmpty(section.settings.buttonLabel) }">
 						    <a th:href="${ section.settings.buttonLink}">
 						        [[${ section.settings.buttonLabel }]]
 						    </a>
 					    </p>
 				    </div>
 			    </div>
 		    </div>
 		    <div class="col-md-6">
                <img class="lazy animated" data-animate="slideInUp" th:src="${imageUrls.thumbnail(section.settings.image1)}" th:alt="${section.settings.alt1}" th:data-original="${imageUrls.original(section.settings.image1)}" th:if="${not #strings.isEmpty(section.settings.image1)}">
 		    </div>
 	    </div>
    </div>

    
    <style th:if="${params.designMode && not #strings.isEmpty(variableCSS)}" th:inline="text" th:utext="${variableCSS}"></style>
</section>
