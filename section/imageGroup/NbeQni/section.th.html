<section th:class="|section${section.settings.marginTop ? ' section-margin-top': ''}${section.settings.marginBottom ? ' section-margin-bottom': ''}${section.settings.paddingTop ? ' section-padding-top': ''}${section.settings.paddingBottom ? ' section-padding-bottom': ''} ${ section.templateId } section-${ section.id }|" th:data-section="${section.templateId}">
    <th:block th:fragment="getContent(heading, content, image, imageClass)" th:if="${not #strings.isEmpty(heading) || not #strings.isEmpty(content) || not #strings.isEmpty(image)}">
        <div th:class="|embed-responsive embed-responsive-${section.settings.imageScale}|">
            <img class="embed-responsive-item lazy"
                 th:src="|${image}!1|"
                 th:data-original="|${image}!${section.settings.wideScreen ? 'f' : ''}8|"
                 th:alt="${heading}"
            >
            <div th:class="|NbeQni-content${section.settings.layoutStyle == 'overlay' ? ' active' : ''}|" th:if="${not #strings.isEmpty(heading) || not #strings.isEmpty(content)}">
                <div class="NbeQni-content-text">
                    <h5 th:if="${not #strings.isEmpty(heading)}" class="text-heading" th:text="${heading}"></h5>
                    <th:block th:if="${not #strings.isEmpty(content)}" th:with="textLines = ${#strings.listSplit(content,'\n')}">
                        <th:block th:each="textLine,saltLine:${textLines}">
                            <p class="text-body" th:if="${not #strings.isEmpty(textLine)}" th:utext="${textLine}"></p>
                        </th:block>
                    </th:block>
                </div>
            </div>
        </div>
    </th:block>
    <div th:class="|container${section.settings.wideScreen ? '-fluid' : ''}|">
        <div class="row">
            <th:block th:if="${ #lists.size(section.settings.imageList) > 2 }">
                <div th:class="|col-md-8 ${section.settings.layout == 'right' ? ' order-2' : ''} NbeQni-item|" th:if="${ #lists.size(section.settings.imageList) > 0 }">
                    <a th:href="${section.settings.imageList[0].link}" th:if="${not #strings.isEmpty(section.settings.imageList[0].link)}">
                        <div th:replace="::getContent(${section.settings.imageList[0].heading}, ${section.settings.imageList[0].content}, ${section.settings.imageList[0].image}, '')"></div>
                    </a>
                    <th:block th:if="${#strings.isEmpty(section.settings.imageList[0].link)}">
                        <div th:replace="::getContent(${section.settings.imageList[0].heading}, ${section.settings.imageList[0].content}, ${section.settings.imageList[0].image}, '')"></div>
                    </th:block>
                </div>
                <div class="col-md-4" th:if="${ #lists.size(section.settings.imageList) > 1 }">
                    <div class="row">
                        <th:block th:each="o, salt:${ section.settings.imageList }">
                            <div class="col-12 NbeQni-item" th:if="${ salt.index > 0 }">
                                <a th:href="${o.link}" th:if="${not #strings.isEmpty(o.link)}">
                                    <div th:replace="::getContent(${o.heading}, ${o.content}, ${o.image}, '')"></div>
                                </a>
                                <th:block th:if="${#strings.isEmpty(o.link)}">
                                    <div th:replace="::getContent(${o.heading}, ${o.content}, ${o.image}, '')"></div>
                                </th:block>
                            </div>
                        </th:block>
                    </div>
                </div>
            </th:block>
            <th:block th:if="${#lists.size(section.settings.imageList) < 3}">
                <div th:class="|col-md-${#lists.size(section.settings.imageList) == 1 ? 12 : 6}|" th:each="o, salt:${ section.settings.imageList }">
                    <a th:href="${o.link}" th:if="${not #strings.isEmpty(o.link)}">
                        <div th:replace="::getContent(${o.heading}, ${o.content}, ${o.image}, '')"></div>
                    </a>
                    <th:block th:if="${#strings.isEmpty(o.link)}">
                        <div th:replace="::getContent(${o.heading}, ${o.content}, ${o.image}, '')"></div>
                    </th:block>
                </div>
            </th:block>
        </div>
    </div>

    
    <style th:if="${params.designMode && not #strings.isEmpty(variableCSS)}" th:inline="text" th:utext="${variableCSS}"></style>
</section>
