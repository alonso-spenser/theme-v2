<section th:class="|section${section.settings.marginTop ? ' section-margin-top': ''}${section.settings.marginBottom ? ' section-margin-bottom': ''}${section.settings.paddingTop ? ' section-padding-top': ''}${section.settings.paddingBottom ? ' section-padding-bottom': ''} ${ section.templateId } section-${ section.id }|" th:data-section="${section.templateId}">
    <div th:class="|container${section.settings.wideScreen ? '-fluid' : ''}|">
        <div th:class="|row ${section.settings.gutter}">
            <div th:class="|col-md-${ o.contentWidth } col-12|" th:each="o,salt:${section.settings.itemList}">
                <a th:if="${not #strings.isEmpty(o.buttonLink)}" th:href="${o.buttonLink}">
				    <div th:class="|embed-responsive embed-responsive-${o.colScale} ${section.templateId}-${salt.index}|">
                        <img class="embed-responsive-item lazy" th:src="|${ o.image}!1|" th:data-original="${o.image}" th:alt="${ not #strings.isEmpty(o.alt) ? o.alt : o.heading}" th:if="${not #strings.isEmpty(o.image)}">
					    <div th:class="|${ section.templateId }-content|">
						    <div class="text-center" th:if="${not #strings.isEmpty(o.heading) || not #strings.isEmpty(o.subheading) || not #strings.isEmpty(o.content)}">
                                <h3 class="text-heading" th:if="${ not #strings.isEmpty(o.heading) }">[[ ${ o.heading } ]]</h3>
                                <h5 class="text-subheading" th:if="${ not #strings.isEmpty(o.subheading) }">[[ ${ o.subheading } ]]</h5>
                                <p class="text-body" th:if="${ not #strings.isEmpty(o.content) }" th:utext="${o.content}">[[ ${ o.content } ]]</p>
						    </div>
					    </div>
				    </div>
                </a>
                <th:block th:if="${#strings.isEmpty(o.buttonLink)}">
				    <div th:class="|embed-responsive embed-responsive-${o.colScale} ${section.templateId}-${salt.index}|">
                        <img class="embed-responsive-item lazy" th:src="|${ o.image}!1|" th:data-original="${o.image}" th:alt="${ not #strings.isEmpty(o.alt) ? o.alt : o.heading}" th:if="${not #strings.isEmpty(o.image)}">
					    <div th:class="|${ section.templateId }-content|">
						    <div class="text-center" th:if="${not #strings.isEmpty(o.heading) || not #strings.isEmpty(o.subheading) || not #strings.isEmpty(o.content)}">
                                <h3 class="text-heading" th:if="${ not #strings.isEmpty(o.heading) }">[[ ${ o.heading } ]]</h3>
                                <h5 class="text-subheading" th:if="${ not #strings.isEmpty(o.subheading) }">[[ ${ o.subheading } ]]</h5>
                                <p class="text-body" th:if="${ not #strings.isEmpty(o.content) }" th:utext="${o.content}">[[ ${ o.content } ]]</p>
						    </div>
					    </div>
				    </div>
                </th:block>
            </div>
        </div>
    </div>

    
    <style th:if="${params.designMode && not #strings.isEmpty(variableCSS)}" th:inline="text" th:utext="${variableCSS}"></style>
</section>
