<section th:class="|section${section.settings.marginTop ? ' section-margin-top': ''}${section.settings.marginBottom ? ' section-margin-bottom': ''}${section.settings.paddingTop ? ' section-padding-top': ''}${section.settings.paddingBottom ? ' section-padding-bottom': ''} ${ section.templateId } section-${ section.id }|" th:data-section="${section.templateId}">
    <div th:class="|container${section.settings.wideScreen ? '-fluid' : ''}|">
	    <div class="row row-gutter">
		    <div th:class="|col-md-${section.settings.column} col-${ section.settings.mobColumn } ${ section.templateId }-item|" th:each="o, salt:${ section.settings.imageList }">
			    <div th:class="|embed-responsive embed-responsive-${section.settings.imageScale}|" th:if="${ #strings.isEmpty(o.buttonLink) }">
				    <img class="embed-responsive-item lazy" th:src="|${o.image}!1|" th:data-original="${o.image}" th:alt="${not #strings.isEmpty(o.alt) ? o.alt : o.heading}">
				    <div th:class="|${ section.templateId }-item-content ${ section.templateId }-${salt.index}|" th:if="${ not #strings.isEmpty(o.heading) || not #strings.isEmpty(o.content) || (not #strings.isEmpty(o.buttonLink) && not #strings.isEmpty(o.buttonLabel)) }">
					    <h3 class="text-heading" th:if="${not #strings.isEmpty(o.heading)}">
						    [[${o.heading}]]
					    </h3>
					    <p class="text-body" th:if="${not #strings.isEmpty(o.content)}" th:utext="${o.content}">
					        [[${o.content}]]
					    </p>
				    </div>
			    </div>
			    <a th:href="${ o.buttonLink}" th:if="${ not #strings.isEmpty(o.buttonLink)}">
                    <div th:class="|embed-responsive embed-responsive-${section.settings.imageScale}|">
                        <img class="embed-responsive-item lazy" th:src="|${o.image}!1|" th:data-original="${o.image}" th:alt="${not #strings.isEmpty(o.alt) ? o.alt : o.heading}">
                        <div th:class="|${ section.templateId }-item-content ${ section.templateId }-${salt.index}|" th:if="${ not #strings.isEmpty(o.heading) || not #strings.isEmpty(o.content) || (not #strings.isEmpty(o.buttonLink) && not #strings.isEmpty(o.buttonLabel)) }">
                            <h3 class="text-heading" th:if="${not #strings.isEmpty(o.heading)}">
                                [[${o.heading}]]
                            </h3>
                            <p class="text-body" th:if="${not #strings.isEmpty(o.content)}" th:utext="${o.content}">
                                [[${o.content}]]
                            </p>
                            <p class="text-link" th:if="${ not #strings.isEmpty(o.buttonLabel) }">
                                [[${o.buttonLabel}]]
                            </p>
                        </div>
                    </div>
			    </a>
		    </div>
	    </div>
    </div>

    
    <style th:if="${params.designMode && not #strings.isEmpty(variableCSS)}" th:inline="text" th:utext="${variableCSS}"></style>
</section>
