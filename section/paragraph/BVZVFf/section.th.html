<section th:class="|section${section.settings.marginTop ? ' section-margin-top': ''}${section.settings.marginBottom ? ' section-margin-bottom': ''}${section.settings.paddingTop ? ' section-padding-top': ''}${section.settings.paddingBottom ? ' section-padding-bottom': ''} ${ section.templateId } section-${ section.id }|" th:data-section="${section.templateId}">
    <div th:class="|container${section.settings.wideScreen ? '-fluid' : ''}|">
        <div th:class="|text-${section.settings.textAlign} section-title section-neighbor|" th:if="${not #strings.isEmpty(section.settings.heading)
            || not #strings.isEmpty(section.settings.subheading)
            || not #strings.isEmpty(section.settings.content)
            || section.settings.dividerWidth > 0
            }"
           >
            <h3 class="text-heading" th:if="${ not #strings.isEmpty(section.settings.heading) }">
                [[${ section.settings.heading }]]
            </h3>

            <div th:class="|section-title-divider ${section.settings.textAlign}${section.settings.dividerStyle == 'image' && not #strings.isEmpty(section.settings.dividerImage) ? ' has-image' : ' has-line'}|" th:if="${ section.settings.dividerWidth > 0 }">
                <img th:src="${imageUrls.original(section.settings.dividerImage)}" alt="" th:if="${ section.settings.dividerStyle == 'image' && not #strings.isEmpty(section.settings.dividerImage) }">
            </div>

            <h5 class="text-subheading" th:if="${ not #strings.isEmpty(section.settings.subheading) }">
                [[${ section.settings.subheading }]]
            </h5>
            <ul th:class="|text-list ${section.settings.paragraphSymbol}|" th:if="${not #strings.isEmpty(section.settings.content)}" th:with="textLines = ${#strings.listSplit(section.settings.content,'\n')}">
                <th:block th:each="textLine,saltLine:${textLines}">
                    <li th:if="${not #strings.isEmpty(textLine)}" th:utext="${textLine}"></li>
                </th:block>
            </ul>
        </div>
        <p class="section-neighbor" th:if="${(section.settings.buttonStyle != 'invisible' && not #strings.isEmpty(section.settings.buttonLabel)) || (section.settings.secondButtonStyle != 'invisible' && not #strings.isEmpty(section.settings.secondButtonLabel))}">
            <a th:href="${section.settings.buttonLink}" th:class="|btn ${section.settings.buttonStyle}|" th:if="${not #strings.isEmpty(section.settings.buttonLink) && section.settings.buttonStyle != 'invisible' && not #strings.isEmpty(section.settings.buttonLabel)}">
                [[${section.settings.buttonLabel}]]
            </a>
            <button th:class="|btn ${ section.settings.buttonStyle }|" th:if="${#strings.isEmpty(section.settings.buttonLink) && section.settings.buttonStyle != 'invisible' && not #strings.isEmpty(section.settings.buttonLabel)}">
                [[${section.settings.buttonLabel}]]
            </button>
            <a th:href="${section.settings.secondButtonLink}" th:class="|btn ${section.settings.secondButtonStyle}|" th:if="${not #strings.isEmpty(section.settings.secondButtonLink) && section.settings.secondButtonStyle != 'invisible' && not #strings.isEmpty(section.settings.secondButtonLabel)}">
                [[${section.settings.secondButtonLabel}]]
            </a>
            <button th:class="|btn ${ section.settings.secondButtonStyle }|" th:if="${#strings.isEmpty(section.settings.secondButtonLink) && section.settings.secondButtonStyle != 'invisible' && not #strings.isEmpty(section.settings.secondButtonLabel)}">
                [[${section.settings.secondButtonLabel}]]
            </button>
        </p>

        <div class="row row-gutter section-neighbor" th:if="${#lists.size(section.settings.quoteList) > 0}">
            <div th:class="|col-md-${section.settings.column}|" th:each="o,stat:${section.settings.quoteList}">
                <div th:class="|BVZVFf-block ${section.settings.quotation ? 'quotation' : ''}|">
                    <h5 class="text-content-heading" th:if="${not #strings.isEmpty(o.title)}" th:text="${o.title}"></h5>
                    <ul th:class="|text-body ${section.settings.contentSymbol}|" th:if="${not #strings.isEmpty(o.describe)}" th:with="textLines = ${#strings.listSplit(o.describe,'\n')}">
                        <th:block th:each="textLine,saltLine:${textLines}">
                            <li class="break-word" th:if="${not #strings.isEmpty(textLine)}" th:utext="${textLine}"></li>
                        </th:block>
                    </ul>

                    <p th:class="|BVZVFf-button ${section.settings.contentSymbol}|" th:if="${o.contentStyle != 'invisible' && not #strings.isEmpty(o.blockLabel)}">
                        <a th:href="${o.blockLink}" th:class="|btn ${o.contentStyle}|" th:if="${not #strings.isEmpty(o.blockLink) && o.contentStyle != 'invisible' && not #strings.isEmpty(o.blockLabel)}">
                            [[${o.blockLabel}]]
                        </a>
                        <button th:class="|btn ${ o.contentStyle }|" th:if="${#strings.isEmpty(o.blockLink) && o.contentStyle != 'invisible' && not #strings.isEmpty(o.blockLabel)}">
                            [[${o.blockLabel}]]
                        </button>
                    </p>
                </div>
            </div>
        </div>
    </div>

    
    <style th:if="${params.designMode && not #strings.isEmpty(variableCSS)}" th:inline="text" th:utext="${variableCSS}"></style>
</section>
