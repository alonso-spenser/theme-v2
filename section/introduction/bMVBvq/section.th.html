<section th:class="|section${section.settings.marginTop ? ' section-margin-top': ''}${section.settings.marginBottom ? ' section-margin-bottom': ''}${section.settings.paddingTop ? ' section-padding-top': ''}${section.settings.paddingBottom ? ' section-padding-bottom': ''} ${ section.templateId } ${section.settings.reduceHeight != null && section.settings.reduceHeight > 0 ? 'fullscreen' : ''} section-${ section.id }|" th:data-section="${section.templateId}">
    <div th:class="|container${section.settings.wideScreen ? '-fluid' : ''}|">
        <div class="row">
            <div class="col-md-4 order-md-2" th:if="${not #strings.isEmpty(section.settings.heading)}">
                <h3 class="text-heading" th:utext="${#strings.replace(section.settings.heading,'\n','<br>')}"></h3>
            </div>
            <div class="col-md-4 order-md-1" th:if="${not #lists.isEmpty(section.settings.itemList)}">
                <th:block th:each="o,stat:${section.settings.itemList}">
                    <div th:class="|media ${ section.templateId }-item item-${stat.index}|" th:if="${stat.index % 2 == 0}">
                        <div class="media-body">
                            <h3 class="text-content-heading" th:if="${not #strings.isEmpty(o.itemHeading)}">
                                [[${o.itemHeading}]]
                            </h3>
                            <p class="text-body" th:if="${not #strings.isEmpty(o.itemContent)}" th:utext="${#strings.replace(o.itemContent,'\n','<br>')}"></p>
                        </div>
                        <img class="lazy" th:src="|${ o.icon}!1|" th:data-original="${o.icon}" th:alt="${o.itemHeading}" th:if="${not #strings.isEmpty(o.icon)}">
                    </div>
                </th:block>
            </div>

            <div class="col-md-4 order-md-3" th:if="${not #lists.isEmpty(section.settings.itemList)}">
                <th:block th:each="o,stat:${section.settings.itemList}">
                    <div th:class="|media ${ section.templateId }-item item-${stat.index} right|" th:if="${stat.index % 2 == 1}">
                        <img class="lazy" th:src="|${ o.icon}!1|" th:data-original="${o.icon}" th:alt="${o.itemHeading}" th:if="${not #strings.isEmpty(o.icon)}">
                        <div class="media-body">
                            <h3 class="text-content-heading" th:if="${not #strings.isEmpty(o.itemHeading)}">
                                [[${o.itemHeading}]]
                            </h3>
                            <p class="text-body" th:if="${not #strings.isEmpty(o.itemContent)}" th:utext="${#strings.replace(o.itemContent,'\n','<br>')}"></p>
                        </div>
                    </div>
                </th:block>
            </div>
        </div>
    </div>

    
    <style th:if="${params.designMode && not #strings.isEmpty(variableCSS)}" th:inline="text" th:utext="${variableCSS}"></style>
</section>
