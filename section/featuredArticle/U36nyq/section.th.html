<section th:class="|section${section.settings.marginTop ? ' section-margin-top': ''}${section.settings.marginBottom ? ' section-margin-bottom': ''}${section.settings.paddingTop ? ' section-padding-top': ''}${section.settings.paddingBottom ? ' section-padding-bottom': ''} ${ section.templateId } section-${ section.id }|" th:data-section="${section.templateId}">
    <div th:class="|${ section.templateId }-main ${section.settings.buttonStyle != 'invisible' && not #strings.isEmpty(section.settings.buttonLabel) ? 'has-button' : ''}|">
        <div th:class="|container${section.settings.wideScreen ? '-fluid' : ''}|">
            <div th:class="|row row-gutter section-neighbor ${ section.templateId }-list|">
                <div th:class="|col-md-${section.settings.column} col-${section.settings.mobColumn}|" th:each="o,salt:${section.data.collectionList}">
                    <a th:href="|${ site.urlPrefix }item/${o.seoUrl}|">
                        <div th:class="|card section-card ${section.settings.cardShadow ? '' : 'no-shadow'}|">
                            <div th:class="|embed-responsive embed-responsive-${section.settings.imageScale}|">
                                <img class="embed-responsive-item card-img-top lazy" th:src="${imageUrls.thumbnail(o.coverImage)}" th:data-original="${imageUrls.original(o.coverImage)}" th:alt="${o.title}"  th:if="${not #strings.isEmpty(o.coverImage)}">
                            </div>
                            <div class="card-body">
                                <h3 th:if="${not #strings.isEmpty(o.title)}" class="text-content-heading" th:text="${o.title}"></h3>
                                <p th:if="${section.settings.subtitleVisible && not #strings.isEmpty(o.subtitle)}" class="text-body" th:text="${o.subtitle}"></p>
                                <p th:if="${section.settings.timeVisible}" class="text-body" th:text="${#dates.format(new java.util.Date(o.createTime),'yyyy-MM-dd')}"></p>
                            </div>
                        </div>
                    </a>
                </div>
            </div>

            <p class="text-button section-neighbor text-center" th:if="${section.settings.buttonStyle != 'invisible' && not #strings.isEmpty(section.settings.buttonLabel)}">
                <button th:class="|btn ${ section.settings.buttonStyle }|" th:if="${#strings.isEmpty(section.settings.buttonLink) && section.settings.buttonStyle != 'invisible'}">[[${ section.settings.buttonLabel }]]</button>
                <a th:href="${ section.settings.buttonLink }" th:class="|btn ${ section.settings.buttonStyle }|"  th:if="${not #strings.isEmpty(section.settings.buttonLink) && section.settings.buttonStyle != 'invisible'}">
                    [[${ section.settings.buttonLabel }]]  <i class="ic-right"></i>
                </a>
            </p>
        </div>
    </div>

    
    <style th:if="${params.designMode && not #strings.isEmpty(variableCSS)}" th:inline="text" th:utext="${variableCSS}"></style>
</section>
