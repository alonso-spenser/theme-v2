<section th:class="|KjbTA8 section-${section.id}|" th:data-section="${section.templateId}">
  <div class="container-full g-0"><div class="row g-0 align-items-stretch">
    <div class="col-12 col-md-6 KjbTA8-media">
      <img th:if="${not #strings.isEmpty(section.settings.image)}" th:src="${section.settings.image}" th:alt="${section.settings.imageAlt}" width="1140" height="1140">
    </div>
    <div class="col-12 col-md-6 KjbTA8-content">
      <h2 class="text-heading" th:if="${not #strings.isEmpty(section.settings.heading)}" th:id="|${section.id}-heading|" th:text="${section.settings.heading}"></h2>
      <div class="text-body KjbTA8-body" th:if="${not #strings.isEmpty(section.settings.paragraphOne) or not #strings.isEmpty(section.settings.paragraphTwo)}">
        <p th:if="${not #strings.isEmpty(section.settings.paragraphOne)}" th:text="${section.settings.paragraphOne}"></p>
        <p th:if="${not #strings.isEmpty(section.settings.paragraphTwo)}" th:text="${section.settings.paragraphTwo}"></p>
      </div>
      <a class="btn btn-outline-primary KjbTA8-cta" th:if="${not #strings.isEmpty(section.settings.buttonLabel) and not #strings.isEmpty(section.settings.buttonUrl)}"
         th:href="${section.settings.buttonUrl}" th:target="${section.settings.newWindow == true ? '_blank' : '_self'}" rel="noopener noreferrer">
        <span th:text="${section.settings.buttonLabel}"></span>
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12h15M12 5l7 7-7 7"/></svg>
      </a>
    </div>
  </div></div>
</section>
