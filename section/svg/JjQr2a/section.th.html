<section th:class="|section${section.settings.marginTop ? ' section-margin-top': ''}${section.settings.marginBottom ? ' section-margin-bottom': ''}${section.settings.paddingTop ? ' section-padding-top': ''}${section.settings.paddingBottom ? ' section-padding-bottom': ''} ${ section.templateId } section-${ section.id }|" th:data-section="${section.templateId}">
    <th:block th:if="${section.settings.style == 'style1'}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 50" preserveAspectRatio="none"><path d="M0,0c0,0,22.4,50,50,50s50-50,50-50"></path></svg>
    </th:block>
    <th:block th:if="${section.settings.style == 'style2'}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 50" preserveAspectRatio="none">
            <path d="M0,0 C0,0 22.4,50 50,50 C77.6,50 100,0 100,0" id="Path" transform="translate(50.000000, 25.000000) scale(1, -1) translate(-50.000000, -25.000000) "></path>
        </svg>
    </th:block>

    
    <style th:if="${params.designMode && not #strings.isEmpty(variableCSS)}" th:inline="text" th:utext="${variableCSS}"></style>
</section>
