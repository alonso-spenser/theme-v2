<section th:class="|section${section.settings.marginTop ? ' section-margin-top': ''}${section.settings.marginBottom ? ' section-margin-bottom': ''}${section.settings.paddingTop ? ' section-padding-top': ''}${section.settings.paddingBottom ? ' section-padding-bottom': ''} ${ section.templateId } section-${ section.id }|" th:data-section="${section.templateId}">
    <div th:class="|container${section.settings.wideScreen ? '-fluid' : ''} d-block d-md-flex align-items-center|">
        <h3 class="text-heading" th:if="${not #strings.isEmpty(section.settings.heading)}">
            [[${section.settings.heading}]]
        </h3>
        <div th:class="|${ section.templateId }-links${section.settings.equalWidth ? ' equal-width' : ''}${section.settings.separator ? ' has-separator' : ''}|">
            <th:block th:each="o,salt:${section.settings.itemList}">
                <a th:class="${o.active ? 'active' : ''}" follow th:href="${o.link}" th:target="${o.target}" th:if="${ section.settings.nofollow == 'normal' }">
                    [[${o.label}]]
                </a>
                <a th:class="${o.active ? 'active' : ''}" th:href="${o.link}" th:target="${o.target}" th:if="${ section.settings.nofollow != 'normal' }">
                    [[${o.label}]]
                </a>
            </th:block>
        </div>
    </div>

    
    <style th:if="${params.designMode && not #strings.isEmpty(variableCSS)}" th:inline="text" th:utext="${variableCSS}"></style>
</section>
