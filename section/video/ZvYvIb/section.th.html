<section th:class="|section${section.settings.marginTop ? ' section-margin-top': ''}${section.settings.marginBottom ? ' section-margin-bottom': ''}${section.settings.paddingTop ? ' section-padding-top': ''}${section.settings.paddingBottom ? ' section-padding-bottom': ''} ${ section.templateId } section-${ section.id }|" th:data-section="${section.templateId}">
    <div th:class="|container${section.settings.wideScreen ? '-fluid' : ''} ${section.settings.guidGutter ? '' : section.templateId + '-fit'}|">
        <div th:class="|row align-items-stretch ${section.settings.guidGutter ? '' : ' no-gutters'}|">
            <div th:class="|col-md-${#numbers.formatInteger(12 - section.settings.percentage, 1,'POINT')} ${ section.templateId }-content ${section.settings.elementLayout == 'right' ? '' : 'order-2'}|">
                <div th:class="|text-${section.settings.textAlign} section-title|" th:if="${not #strings.isEmpty(section.settings.heading)
                || not #strings.isEmpty(section.settings.subheading)
                || not #strings.isEmpty(section.settings.content)
                || section.settings.dividerWidth > 0
                }">
                    <h3 class="text-heading" th:if="${ not #strings.isEmpty(section.settings.heading) }">
                        [[${ section.settings.heading }]]
                    </h3>

                    <div th:class="|section-title-divider ${section.settings.textAlign}${section.settings.dividerStyle == 'image' && not #strings.isEmpty(section.settings.dividerImage) ? ' has-image' : ' has-line'}|" th:if="${ section.settings.dividerWidth > 0 }">
                        <img th:src="${imageUrls.original(section.settings.dividerImage)}" alt="" th:if="${ section.settings.dividerStyle == 'image' && not #strings.isEmpty(section.settings.dividerImage) }">
                    </div>

                    <h5 class="text-subheading" th:if="${ not #strings.isEmpty(section.settings.subheading) }">
                        [[${ section.settings.subheading }]]
                    </h5>
                    <th:block th:if="${not #strings.isEmpty(section.settings.content)}" th:with="textLines = ${#strings.listSplit(section.settings.content,'\n')}">
                        <th:block th:each="textLine,saltLine:${textLines}">
                            <p class="text-body" th:if="${not #strings.isEmpty(textLine)}" th:utext="${textLine}"></p>
                        </th:block>
                    </th:block>
                    <p class="text-button" th:if="${section.settings.buttonStyle != 'invisible' && not #strings.isEmpty(section.settings.buttonLabel)}">
                        <button th:class="|btn ${ section.settings.buttonStyle }|" th:if="${#strings.isEmpty(section.settings.buttonLink)}">[[${section.settings.buttonLabel}]]</button>
                        <a th:href="${section.settings.buttonLink}" th:class="|btn ${section.settings.buttonStyle}|" th:if="${not #strings.isEmpty(section.settings.buttonLink)}">[[${section.settings.buttonLabel}]]</a>
                    </p>
                </div>
            </div>
            <div th:class="|col-md-${ section.settings.percentage }|">
                <div class="embed-responsive embed-responsive-video">
                    <div th:class="|embed-responsive-item ${ section.templateId }-mask|" data-play="action">
                        <img th:if="${ not #strings.isEmpty(section.settings.poster) }" class="embed-responsive-item lazy" th:src="${imageUrls.thumbnail(section.settings.poster)}" th:data-original="${imageUrls.original(section.settings.poster)}">
                        <div class="play-button">
                            <span class="filled-circle"></span>
                            <span class="stroke-circle"></span>
                            <span class="triangle custom-icon-triangle"></span>
                        </div>
                    </div>
                    <iframe class="embed-responsive-item" allowfullscreen th:data-video="|${section.settings.video}?autoplay=1&loop=1|" th:if="${ not #strings.isEmpty(section.settings.video) }"></iframe>
                </div>
            </div>
        </div>
    </div>

    
    <style th:if="${params.designMode && not #strings.isEmpty(variableCSS)}" th:inline="text" th:utext="${variableCSS}"></style>
</section>
