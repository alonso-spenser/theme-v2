<section th:class="|section${section.settings.marginTop ? ' section-margin-top': ''}${section.settings.marginBottom ? ' section-margin-bottom': ''}${section.settings.paddingTop ? ' section-padding-top': ''}${section.settings.paddingBottom ? ' section-padding-bottom': ''} ${ section.templateId } section-${ section.id }|" th:data-section="${section.templateId}">
	<div class="embed-responsive">
		<div class="embed-responsive-item d-flex" th:data-play="|${section.settings.videoURL}?autoplay=1&loop=1|" th:if="${ not #strings.isEmpty(section.settings.videoURL) }">
			<div th:class="|${ section.templateId }-content text-center|">
				<img class="lazy" th:src="${imageUrls.thumbnail(section.settings.logo)}" th:data-original="${imageUrls.original(section.settings.logo)}" th:if="${ not #strings.isEmpty(section.settings.logo) }" th:alt="${section.settings.heading}">
				<h3 th:if="${ not #strings.isEmpty(section.settings.heading) }">
					[[${ section.settings.heading }]]
				</h3>
				<div th:class="|${ section.templateId }-play|">
					[[${ section.settings.buttonLabel }]]
				</div>
			</div>
		</div>
		<video th:preload="${ not #strings.isEmpty(section.settings.image) ? section.settings.image : '' }" loop="loop" autoplay muted="muted" th:if="${ not #strings.isEmpty(section.settings.backVideo) }">
			<source th:src="${section.settings.backVideo}">
		</video>
	</div>
    
    <style th:if="${params.designMode && not #strings.isEmpty(variableCSS)}" th:inline="text" th:utext="${variableCSS}"></style>
</section>
